<!doctype html>
<!-- THE VAULT — Single-Page Application (SPA) Shell -->
<!-- All 10 screens render dynamically inside <div id="vault-root"> via URL parameters (?page=home, ?page=explore, etc.). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1efe8">
  <meta name="description" content="THE VAULT — an independent digital auction house for exceptional objects.">
  <title>THE VAULT — Where rarity meets competition.</title>

  <!-- Editorial Typography: Instrument Serif (Headlines), DM Sans (UI Body), DM Mono (Labels/Lot Codes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Unified Stylesheet covering all 10 screens, responsive grids, cursor/loader & Sound Jar -->
  <link rel="stylesheet" href="css/vault.css">

  <!-- Vendor 3D WebGL Engine (Three.js r128 + GLTF loader + OrbitControls) & Supabase PostgreSQL/Auth SDK -->
  <!-- 'defer' preserves exact dependency execution order after HTML parsing completes -->
  <script defer src="vendor/three.min.js"></script>
  <script defer src="vendor/GLTFLoader.js"></script>
  <script defer src="vendor/OrbitControls.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>

  <!-- Application Modules: 1. Data & Config -> 2. Core & SPA Router -> 3. Sensory Effects -> 4. Views & Controllers -->
  <script defer src="js/data.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/effects.js"></script>
  <script defer src="js/pages.js"></script>
</head>
<!-- Initial route fallback is 'home'; pages.js updates data-page and body theme classes dynamically on route change. -->
<body data-page="home"></body>
</html>
